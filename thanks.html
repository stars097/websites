<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Спасибо за заявку | Кафе СССР</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #1a3a32;
            color: #f4f1ea;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            text-align: center;
            padding: 20px;
        }
        .card {
            background-color: rgba(255,255,255,0.05);
            border: 2px solid #d4af37;
            border-radius: 12px;
            padding: 50px 40px;
            max-width: 500px;
        }
        h1 {
            color: #d4af37;
            font-size: 32px;
            margin-bottom: 20px;
        }
        p {
            font-size: 18px;
            line-height: 1.6;
            margin-bottom: 30px;
        }
        a {
            display: inline-block;
            padding: 12px 30px;
            background-color: #d4af37;
            color: #1a3a32;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        a:hover {
            background-color: #e0cfa5;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Спасибо! 🎉</h1>
        <p>Ваша заявка на бронирование получена.<br>Мы свяжемся с вами в ближайшее время для подтверждения.</p>
        <a href="/">Вернуться на сайт</a>
    </div>
</body>
</html>
